# Builds a signed release APK of Podium and publishes it as a GitHub
# Release — the same as running, from a terminal:
#   flutter build apk --release
#   gh release create v<version> app-release.apk --notes "…"
# On a pushed v* tag or a manual run, it also builds the Play Store bundle
# (.aab), after checking its build number is above every AAB built before.
# Setup (keystore secrets) is described in CI_SETUP.md.
name: Build & release (Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Notes de version (facultatif, remplace le changelog automatique)"
        required: false
        type: string

# A newer push on the same branch cancels the build still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Needed to create the release and its tag.
  contents: write

env:
  # Same version as the one used locally (flutter --version).
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Vérifier les secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant : $name (voir CI_SETUP.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, for the changelog.
          fetch-depth: 0

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle wrapper, dependencies and build cache between runs
      # (the release build is most of the job's time).
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Activer le build cache Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Only errors fail the build; infos and warnings are just reported.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        run: flutter test

      - name: Restaurer le keystore et key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          # storeFile is resolved relative to android/app (see android/app/build.gradle).
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK release
        run: flutter build apk --release

      - name: Vérifier la signature de l’APK
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -n 8

      # ---------------------------------------------------------------
      # Play Store bundle (.aab) — only for a pushed v* tag or a manual run.
      # Every AAB built here is recorded as a git tag aab/<versionCode>
      # (see the last step), so each new one can be checked against them.
      # ---------------------------------------------------------------

      - name: "AAB : vérifier le numéro de build"
        id: aabversion
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          build=${full##*+}
          # Highest versionCode of an AAB already generated (none → 0).
          previous=$(git tag -l 'aab/*' | sed 's#^aab/##' | grep -E '^[0-9]+$' | sort -n | tail -n1)
          if [ -z "$previous" ]; then
            echo "Aucun AAB généré auparavant : numéro de build $build accepté."
          elif [ "$build" -le "$previous" ]; then
            echo "::error::Numéro de build $build ≤ $previous (dernier AAB généré) : Google Play le refuserait. Passe « version: » à …+$((previous + 1)) (ou plus) dans pubspec.yaml."
            exit 1
          else
            echo "Numéro de build $build > $previous (dernier AAB généré) ✓"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Build AAB release (Play Store)
        if: steps.aabversion.outputs.build != ''
        run: flutter build appbundle --release

      # A ready-to-paste prompt for Claude that turns the commits since the
      # last AAB into Play Console release notes. Shown in the run summary
      # and in the GitHub release.
      - name: "AAB : prompt des notes de mise à jour"
        if: steps.aabversion.outputs.build != ''
        env:
          PREVIOUS: ${{ steps.aabversion.outputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            commits=$(git log "aab/$PREVIOUS..HEAD" --no-merges --pretty=format:'* %s')
            since="depuis la version précédente publiée sur Google Play"
          else
            commits=$(git log -n 30 --no-merges --pretty=format:'* %s')
            since="récents"
          fi
          {
            echo "Rédige les notes de mise à jour Google Play de Podium, une app Android de suivi de scores et de classements pour les jeux entre amis, à partir de ces commits $since :"
            echo
            echo "$commits"
            echo
            echo "Consignes :"
            echo "- En français, pour les utilisateurs de l'app : aucun jargon technique, aucun nom de fichier ni de code."
            echo "- Mets en avant les nouveautés visibles, puis les corrections ; ignore les changements internes (CI, tests, refactorisation, sécurité côté serveur)."
            echo "- 80 caractères maximum entre les balises (balises non comprises), espaces compris."
            echo "- Réponds uniquement avec ce bloc, sans rien avant ni après :"
            echo
            echo "<fr-FR>"
            echo "Nouveautés : … · Corrections : …"
            echo "</fr-FR>"
          } > play_notes_prompt.txt
          {
            echo "## Notes de mise à jour Google Play"
            echo
            echo "Copie ce prompt dans Claude, puis colle sa réponse dans la Play Console :"
            echo
            echo '```text'
            cat play_notes_prompt.txt
            echo '```'
          } > play_notes_prompt.md
          cat play_notes_prompt.md >> "$GITHUB_STEP_SUMMARY"
          cat play_notes_prompt.txt

      - name: Déterminer la version
        id: version
        env:
          AAB_BUILD: ${{ steps.aabversion.outputs.build }}
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')   # ex. 3.0.1+41
          name=${full%%+*}
          build=${full##*+}
          # Pushed tag: that tag. Otherwise: v<version of pubspec.yaml>.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$name"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=podium-$tag-build$build.apk" >> "$GITHUB_OUTPUT"
          # The Play bundle carries its own, computed build number.
          if [ -n "$AAB_BUILD" ]; then echo "aab=podium-$tag-build$AAB_BUILD.aab" >> "$GITHUB_OUTPUT"; fi
          echo "Version $full → release $tag"

      - name: Générer les notes de version
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "Build #${GITHUB_RUN_NUMBER} — commit $(git rev-parse --short HEAD) (${GITHUB_REF_NAME})"
            echo
            if [ -n "$MANUAL_NOTES" ]; then
              echo "$MANUAL_NOTES"
            else
              # Commits since the previous release tag (any tag but this one),
              # or the last 15 commits when there is none yet.
              prev_tag=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
              echo "## Changements${prev_tag:+ depuis $prev_tag}"
              if [ -n "$prev_tag" ]; then
                git log "$prev_tag..HEAD" --no-merges --pretty=format:'- %s (%h)' | head -n 40
              else
                git log -n 15 --no-merges --pretty=format:'- %s (%h)'
              fi
            fi
            if [ -f play_notes_prompt.md ]; then
              echo
              echo
              cat play_notes_prompt.md
            fi
          } > release_notes.txt
          cat release_notes.txt

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.version.outputs.apk }}
          AAB: ${{ steps.version.outputs.aab }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          files=("$APK")
          if [ -n "$AAB" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "$AAB"
            files+=("$AAB")
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Tag pushed by hand: publish on that tag (update the files if the release exists).
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" --clobber
              gh release edit "$TAG" --notes-file release_notes.txt
            else
              gh release create "$TAG" "${files[@]}" --title "Podium $TAG" --notes-file release_notes.txt --verify-tag
            fi
          else
            # Push on main (or manual run): same version as before → replace that
            # release, so its tag moves to the commit that was just built.
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$TAG" "${files[@]}" --title "Podium $NAME" --notes-file release_notes.txt --target "$GITHUB_SHA" --latest
          fi
          echo "Release : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - name: "AAB : enregistrer le numéro de build"
        if: steps.aabversion.outputs.build != ''
        env:
          BUILD: ${{ steps.aabversion.outputs.build }}
        run: |
          git tag "aab/$BUILD" "$GITHUB_SHA"
          git push origin "aab/$BUILD"

      - name: Nettoyer les fichiers de signature
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
